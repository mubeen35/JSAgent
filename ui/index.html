<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Search AI — Dashboard</title>
  <meta name="description" content="AI-powered job match dashboard — find your most relevant roles ranked by semantic fit." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:       #070b14;
      --bg-card:       rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border:        rgba(255,255,255,0.08);
      --border-hover:  rgba(255,255,255,0.18);
      --text-primary:  #f0f4ff;
      --text-secondary:#8b95b0;
      --text-muted:    #4a5270;
      --accent:        #6366f1;
      --accent-glow:   rgba(99,102,241,0.35);

      --tier-excellent: #00d4aa;
      --tier-good:      #6366f1;
      --tier-partial:   #f59e0b;
      --tier-low:       #ef4444;

      --radius:  16px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,0.5);
      --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background mesh ───────────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(99,102,241,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 80%,  rgba(0,212,170,0.10) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ────────────────────────────────────────────────────────────── */
    .page { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 24px 80px; }

    /* ── Header ────────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 32px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #6366f1, #00d4aa);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .logo h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .logo span { font-size: 12px; color: var(--text-secondary); display: block; font-weight: 400; margin-top: 1px; }

    /* ── Scan button ───────────────────────────────────────────────────────── */
    #scanBtn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 22px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none; border-radius: 50px;
      font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 24px var(--accent-glow);
      transition: var(--transition);
      position: relative; overflow: hidden;
    }
    #scanBtn:hover { transform: translateY(-1px); box-shadow: 0 0 36px rgba(99,102,241,0.55); }
    #scanBtn:active { transform: translateY(0); }
    #scanBtn.running { background: linear-gradient(135deg, #374151, #4b5563); box-shadow: none; cursor: not-allowed; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Stats bar ─────────────────────────────────────────────────────────── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin: 28px 0 32px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      backdrop-filter: blur(12px);
      transition: var(--transition);
      text-align: center;
    }
    .stat-card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }

    .stat-value {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #f0f4ff, #c7d2fe);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; }

    .stat-card.excellent .stat-value { background: linear-gradient(135deg,#00d4aa,#00f5c8); -webkit-background-clip: text; background-clip: text; }
    .stat-card.good      .stat-value { background: linear-gradient(135deg,#6366f1,#a78bfa); -webkit-background-clip: text; background-clip: text; }
    .stat-card.partial   .stat-value { background: linear-gradient(135deg,#f59e0b,#fbbf24); -webkit-background-clip: text; background-clip: text; }

    /* ── Filter bar ────────────────────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1; min-width: 200px;
    }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    #searchInput {
      width: 100%; padding: 11px 14px 11px 42px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 50px; color: var(--text-primary);
      font-family: inherit; font-size: 14px;
      outline: none; transition: var(--transition);
    }
    #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    #searchInput::placeholder { color: var(--text-muted); }

    .filter-btn {
      padding: 10px 18px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 50px; color: var(--text-secondary);
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: var(--transition);
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .filter-btn.active { background: rgba(99,102,241,0.15); border-color: var(--accent); color: #a5b4fc; }

    #roleFilter, #remoteFilter {
      padding: 10px 16px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 50px; color: var(--text-secondary);
      font-family: inherit; font-size: 13px;
      cursor: pointer; outline: none; transition: var(--transition);
    }
    #roleFilter:focus, #remoteFilter:focus { border-color: var(--accent); }

    /* ── Job Grid ──────────────────────────────────────────────────────────── */
    #jobGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    /* ── Job Card ──────────────────────────────────────────────────────────── */
    .job-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(16px);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 16px;
      cursor: default;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.4s ease both;
    }
    .job-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--card-accent, linear-gradient(90deg, #6366f1, #00d4aa));
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .job-card:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card Top Row ──────────────────────────────────────────────────────── */
    .card-top { display: flex; align-items: flex-start; gap: 14px; }

    /* Score ring */
    .score-ring {
      flex-shrink: 0;
      position: relative; width: 64px; height: 64px;
    }
    .score-ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 5; }
    .ring-fill { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1); }
    .score-text {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; line-height: 1;
    }
    .score-pct { font-size: 11px; color: var(--text-secondary); margin-top: 1px; font-weight: 500; }

    /* Card meta */
    .card-meta { flex: 1; min-width: 0; }
    .card-title {
      font-size: 15px; font-weight: 700; line-height: 1.35;
      color: var(--text-primary);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-company { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .card-location { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ── Tier badge ────────────────────────────────────────────────────────── */
    .tier-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 50px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
    }
    .tier-excellent { background: rgba(0,212,170,0.15); color: #00d4aa; }
    .tier-good      { background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .tier-partial   { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .tier-low       { background: rgba(239,68,68,0.12);  color: #fca5a5; }

    /* ── Badges row ────────────────────────────────────────────────────────── */
    .badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge {
      padding: 3px 10px; border-radius: 50px; font-size: 11px; font-weight: 600;
    }
    .badge-role   { background: rgba(139,92,246,0.15); color: #c4b5fd; }
    .badge-remote { background: rgba(0,212,170,0.12); color: #00d4aa; }
    .badge-yoe    { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

    /* ── Tech chips ────────────────────────────────────────────────────────── */
    .tech-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 3px 10px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); border-radius: 50px;
      font-size: 11px; color: var(--text-secondary); font-weight: 500;
    }
    .chip.match { background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.3); color: #a5b4fc; }

    /* ── Feedback text ─────────────────────────────────────────────────────── */
    .feedback {
      font-size: 12px; line-height: 1.6; color: var(--text-secondary);
      background: rgba(255,255,255,0.03);
      border-left: 2px solid var(--border-hover);
      padding: 10px 12px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    /* ── Card actions ──────────────────────────────────────────────────────── */
    .card-actions { display: flex; gap: 10px; margin-top: auto; }

    .btn-apply {
      flex: 1;
      padding: 10px 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center;
      transition: var(--transition); text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-apply:hover { transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }
    .btn-apply.disabled { background: rgba(255,255,255,0.06); color: var(--text-muted); cursor: default; }
    .btn-apply.disabled:hover { transform: none; box-shadow: none; }

    .btn-copy {
      padding: 10px 14px;
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-secondary); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 12px; cursor: pointer;
      transition: var(--transition);
    }
    .btn-copy:hover { border-color: var(--border-hover); color: var(--text-primary); }

    /* ── Loading / Empty states ────────────────────────────────────────────── */
    .loading-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px;
    }
    .skeleton {
      height: 280px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; position: relative;
    }
    .skeleton::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
      animation: shimmer 1.6s infinite;
    }
    @keyframes shimmer { to { transform: translateX(100%); } }

    .empty-state {
      grid-column: 1/-1; text-align: center; padding: 80px 24px;
      color: var(--text-secondary);
    }
    .empty-state svg { opacity: 0.3; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }

    /* ── Toast notification ────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 32px; right: 32px;
      background: rgba(15,20,35,0.95);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-sm);
      padding: 14px 20px;
      font-size: 13px; font-weight: 500;
      backdrop-filter: blur(16px);
      transform: translateY(80px); opacity: 0;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      z-index: 100;
      max-width: 320px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: rgba(0,212,170,0.4); color: #00d4aa; }
    #toast.info    { border-color: rgba(99,102,241,0.4); color: #a5b4fc; }
    #toast.error   { border-color: rgba(239,68,68,0.4);  color: #fca5a5; }

    /* ── Pagination ────────────────────────────────────────────────────────── */
    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 40px; flex-wrap: wrap; }
    .page-btn {
      width: 38px; height: 38px; border-radius: var(--radius-sm);
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-secondary); font-family: inherit; font-size: 13px;
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
    }
    .page-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .page-btn.active { background: rgba(99,102,241,0.2); border-color: var(--accent); color: #a5b4fc; }
    .page-btn:disabled { opacity: 0.3; cursor: default; }

    /* ── Results count ─────────────────────────────────────────────────────── */
    .results-meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
    .results-meta strong { color: var(--text-primary); }

    /* ── Status indicator ──────────────────────────────────────────────────── */
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--tier-excellent);
      display: inline-block; margin-right: 6px;
    }
    .status-dot.running { animation: pulse 1s ease infinite; background: #f59e0b; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── Responsive ────────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .header { padding: 20px 0 24px; }
      #jobGrid { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div>
        <h1>Job Search AI</h1>
        <span id="lastScan">Loading...</span>
      </div>
    </div>
    <button id="scanBtn" onclick="triggerScan()">
      <svg id="scanIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
      </svg>
      <span id="scanText">Scan New Jobs</span>
    </button>
  </header>

  <!-- ── Stats Bar ────────────────────────────────────────────────────────── -->
  <section class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="stat-value" id="statTotal">—</div><div class="stat-label">Jobs Analyzed</div></div>
    <div class="stat-card"><div class="stat-value" id="statAvg">—</div><div class="stat-label">Avg Match Score</div></div>
    <div class="stat-card excellent"><div class="stat-value" id="statExcellent">—</div><div class="stat-label">Excellent Matches</div></div>
    <div class="stat-card good"><div class="stat-value" id="statGood">—</div><div class="stat-label">Good Matches</div></div>
    <div class="stat-card partial"><div class="stat-value" id="statPartial">—</div><div class="stat-label">Partial Matches</div></div>
  </section>

  <!-- ── Filter Bar ────────────────────────────────────────────────────────── -->
  <div class="filter-bar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search by title or company..." oninput="debounceLoad()" />
    </div>
    <select id="roleFilter" onchange="loadJobs(1)" title="Filter by role type">
      <option value="">All roles</option>
      <option value="backend">Backend</option>
      <option value="frontend">Frontend</option>
      <option value="fullstack">Full Stack</option>
      <option value="ml">ML / AI</option>
      <option value="devops">DevOps</option>
      <option value="data">Data</option>
    </select>
    <button class="filter-btn" id="btnAll"       onclick="setScore(0,    'btnAll')"       >All</button>
    <button class="filter-btn" id="btnGood"      onclick="setScore(0.55, 'btnGood')"      >Good+</button>
    <button class="filter-btn active" id="btnExcellent" onclick="setScore(0.75, 'btnExcellent')" style="display:none">Excellent</button>
  </div>

  <!-- ── Results meta ──────────────────────────────────────────────────────── -->
  <div class="results-meta" id="resultsMeta"></div>

  <!-- ── Job Grid ──────────────────────────────────────────────────────────── -->
  <div id="jobGrid"></div>

  <!-- ── Pagination ────────────────────────────────────────────────────────── -->
  <div class="pagination" id="pagination"></div>

</div><!-- /.page -->

<!-- ── Toast ───────────────────────────────────────────────────────────────── -->
<div id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let currentPage   = 1;
  let minScore      = 0;
  let debounceTimer = null;
  let pollTimer     = null;

  const TIER = {
    excellent: { min: 0.75, label: 'Excellent Match', cls: 'tier-excellent', color: '#00d4aa', accent: 'linear-gradient(90deg,#00d4aa,#00f5c8)' },
    good:      { min: 0.55, label: 'Good Match',      cls: 'tier-good',      color: '#6366f1', accent: 'linear-gradient(90deg,#6366f1,#8b5cf6)' },
    partial:   { min: 0.35, label: 'Partial Match',   cls: 'tier-partial',   color: '#f59e0b', accent: 'linear-gradient(90deg,#f59e0b,#fbbf24)' },
    low:       { min: 0,    label: 'Low Match',       cls: 'tier-low',       color: '#ef4444', accent: 'linear-gradient(90deg,#ef4444,#f87171)' },
  };

  function getTier(score) {
    if (score >= TIER.excellent.min) return TIER.excellent;
    if (score >= TIER.good.min)      return TIER.good;
    if (score >= TIER.partial.min)   return TIER.partial;
    return TIER.low;
  }

  // ── Load Stats ─────────────────────────────────────────────────────────────
  async function loadStats() {
    try {
      const res  = await fetch('/api/stats');
      const data = await res.json();

      document.getElementById('statTotal').textContent     = data.total_jobs ?? '—';
      document.getElementById('statAvg').textContent       = data.avg_score ? (data.avg_score * 100).toFixed(0) + '%' : '—';
      document.getElementById('statExcellent').textContent = data.excellent ?? '—';
      document.getElementById('statGood').textContent      = data.good ?? '—';
      document.getElementById('statPartial').textContent   = data.partial ?? '—';

      const scan = data.last_scan
        ? new Date(data.last_scan).toLocaleString([], {dateStyle:'medium', timeStyle:'short'})
        : 'Never';
      const running = data.pipeline_running;
      document.getElementById('lastScan').innerHTML =
        `<span class="status-dot ${running ? 'running' : ''}"></span>${running ? 'Scanning...' : 'Last scan: ' + scan}`;

      updateScanBtn(running);
    } catch(e) { console.error('Stats error:', e); }
  }

  // ── Load Jobs ──────────────────────────────────────────────────────────────
  async function loadJobs(page = currentPage) {
    currentPage = page;
    const grid = document.getElementById('jobGrid');
    const search   = document.getElementById('searchInput').value.trim();
    const roleType = document.getElementById('roleFilter').value;

    // Show skeletons
    grid.innerHTML = Array(6).fill('<div class="skeleton"></div>').join('');
    grid.className = 'loading-grid';

    const params = new URLSearchParams({
      page, per_page: 12, min_score: minScore,
      ...(search   ? { search }   : {}),
      ...(roleType ? { role_type: roleType } : {}),
    });

    try {
      const res  = await fetch(`/api/jobs?${params}`);
      const data = await res.json();
      renderJobs(data);
    } catch(e) {
      grid.innerHTML = `<div class="empty-state"><h3>Could not load jobs</h3><p>Is the API server running?</p></div>`;
      grid.className = '';
    }
  }

  // ── Render Jobs ────────────────────────────────────────────────────────────
  function renderJobs({ jobs, total, page, per_page }) {
    const grid = document.getElementById('jobGrid');
    grid.className = '';

    document.getElementById('resultsMeta').innerHTML =
      total ? `Showing <strong>${(page-1)*per_page+1}–${Math.min(page*per_page,total)}</strong> of <strong>${total}</strong> matched jobs` : '';

    if (!jobs.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <h3>No jobs found</h3>
          <p>Try adjusting your filters or run a new scan.</p>
        </div>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    grid.innerHTML = jobs.map((job, i) => jobCard(job, i)).join('');
    renderPagination(total, page, per_page);

    // Animate score rings
    requestAnimationFrame(() => {
      jobs.forEach((job, i) => {
        const ring = document.querySelector(`[data-ring="${i}"]`);
        if (ring) animateRing(ring, job.match_score);
      });
    });
  }

  // ── Job Card HTML ──────────────────────────────────────────────────────────
  function jobCard(job, i) {
    const tier  = getTier(job.match_score);
    const pct   = Math.round(job.match_score * 100);
    const chips = (job.tech_stack || []).slice(0, 6);
    const feedback = (job.evaluation_feedback || '').split('|').slice(1).join('|').trim();

    return `
    <div class="job-card" style="--card-accent:${tier.accent}; animation-delay:${i*0.04}s">
      <div class="card-top">
        <div class="score-ring" data-ring="${i}">
          <svg viewBox="0 0 64 64">
            <circle class="ring-bg" cx="32" cy="32" r="27"/>
            <circle class="ring-fill" cx="32" cy="32" r="27"
              stroke="${tier.color}"
              stroke-dasharray="${2*Math.PI*27}"
              stroke-dashoffset="${2*Math.PI*27}"
              data-target="${2*Math.PI*27*(1-job.match_score)}"/>
          </svg>
          <div class="score-text" style="color:${tier.color}">
            <span>${pct}%</span>
            <span class="score-pct">fit</span>
          </div>
        </div>
        <div class="card-meta">
          <div class="card-title">${esc(job.title || 'Untitled')}</div>
          ${job.company ? `<div class="card-company">${esc(job.company)}</div>` : ''}
          ${job.location ? `<div class="card-location">📍 ${esc(job.location)}${job.remote ? ' · Remote' : ''}</div>` : ''}
        </div>
      </div>

      <div class="badges">
        <span class="tier-badge ${tier.cls}">${tier.label}</span>
        ${job.role_type ? `<span class="badge badge-role">${job.role_type}</span>` : ''}
        ${job.remote    ? `<span class="badge badge-remote">Remote</span>` : ''}
        ${job.years_experience ? `<span class="badge badge-yoe">${job.years_experience}+ yrs</span>` : ''}
      </div>

      ${chips.length ? `<div class="tech-chips">${chips.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}

      ${feedback ? `<div class="feedback">${esc(feedback)}</div>` : ''}

      <div class="card-actions">
        ${job.url
          ? `<a class="btn-apply" href="${esc(job.url)}" target="_blank" rel="noopener">View & Apply ↗</a>`
          : `<button class="btn-apply disabled" onclick="toast('No direct URL stored — search the title on LinkedIn or the company site.','info')">Search This Job</button>`
        }
        <button class="btn-copy" onclick="copyTitle('${esc(job.title||'')}')">Copy Title</button>
      </div>
    </div>`;
  }

  // ── Animate score ring ─────────────────────────────────────────────────────
  function animateRing(container, score) {
    const fill = container.querySelector('.ring-fill');
    if (!fill) return;
    const target = parseFloat(fill.dataset.target);
    fill.style.strokeDashoffset = target;
  }

  // ── Pagination ─────────────────────────────────────────────────────────────
  function renderPagination(total, page, per_page) {
    const pages = Math.ceil(total / per_page);
    if (pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

    let html = '';
    html += `<button class="page-btn" onclick="loadJobs(${page-1})" ${page===1?'disabled':''}>&#8592;</button>`;
    for (let p = Math.max(1,page-2); p <= Math.min(pages,page+2); p++) {
      html += `<button class="page-btn${p===page?' active':''}" onclick="loadJobs(${p})">${p}</button>`;
    }
    html += `<button class="page-btn" onclick="loadJobs(${page+1})" ${page===pages?'disabled':''}>&#8594;</button>`;
    document.getElementById('pagination').innerHTML = html;
  }

  // ── Score filter ───────────────────────────────────────────────────────────
  function setScore(score, btnId) {
    minScore = score;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(btnId)?.classList.add('active');
    loadJobs(1);
  }

  // ── Scan trigger ───────────────────────────────────────────────────────────
  async function triggerScan() {
    const btn = document.getElementById('scanBtn');
    if (btn.classList.contains('running')) return;
    try {
      const res  = await fetch('/api/run', { method: 'POST' });
      const data = await res.json();
      if (data.status === 'already_running') {
        showToast('Pipeline is already running...', 'info');
      } else {
        showToast('Pipeline scan started! Results will update automatically.', 'success');
        startPolling();
      }
    } catch(e) {
      showToast('Could not trigger scan — is the server running?', 'error');
    }
  }

  function updateScanBtn(running) {
    const btn  = document.getElementById('scanBtn');
    const icon = document.getElementById('scanIcon');
    const text = document.getElementById('scanText');
    if (running) {
      btn.classList.add('running');
      icon.classList.add('spin');
      text.textContent = 'Scanning...';
    } else {
      btn.classList.remove('running');
      icon.classList.remove('spin');
      text.textContent = 'Scan New Jobs';
    }
  }

  // Poll while pipeline is running, then reload results
  function startPolling() {
    clearInterval(pollTimer);
    let wasRunning = true;
    pollTimer = setInterval(async () => {
      const res  = await fetch('/api/run/status');
      const data = await res.json();
      updateScanBtn(data.running);
      if (wasRunning && !data.running) {
        clearInterval(pollTimer);
        showToast('Scan complete! Refreshing results...', 'success');
        setTimeout(() => { loadStats(); loadJobs(1); }, 800);
      }
      wasRunning = data.running;
    }, 3000);
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function copyTitle(title) {
    navigator.clipboard.writeText(title).then(() => showToast('Title copied to clipboard!', 'success'));
  }

  function debounceLoad() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => loadJobs(1), 350);
  }

  let toastTimer;
  function showToast(msg, type='info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 4000);
  }
  // expose for inline calls
  function toast(msg, type) { showToast(msg, type); }

  // ── Init ───────────────────────────────────────────────────────────────────
  async function init() {
    // Start with "Good+" filter active by default to show most relevant
    minScore = 0;
    document.getElementById('btnAll').classList.add('active');
    await Promise.all([loadStats(), loadJobs(1)]);

    // Check if pipeline is already running on page load
    const res  = await fetch('/api/run/status');
    const data = await res.json();
    if (data.running) { updateScanBtn(true); startPolling(); }

    // Refresh stats every 30s
    setInterval(loadStats, 30000);
  }

  init();
</script>
</body>
</html>
